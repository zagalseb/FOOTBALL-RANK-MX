<title>[ENTRENAMIENTO] QBMAP</title>
<script>
// Entrada de ENTRENAMIENTO: abre la página real (capture/QBMAP.html) en modo staging
// (datos de covercero_staging). Conserva el resto de la URL (?game=, ?cat=, #...).
// No contiene lógica de la app: el código sigue viviendo en capture/QBMAP.html.
(function () {
  var target = new URL('../../capture/QBMAP.html', location.href)
  var q = new URLSearchParams(location.search)
  q.set('env', 'staging')
  target.search = q.toString()
  target.hash = location.hash
  location.replace(target.href)
})()
</script>
</head>
<body>
<noscript><p>Abre <a href="../../capture/QBMAP.html?env=staging">QBMAP en modo entrenamiento</a>.</p></noscript>
