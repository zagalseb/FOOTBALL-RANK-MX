// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [game,      setGame]      = useState(null);
  const [plays,     setPlays]     = useState([]);
  const [weekGames, setWeekGames] = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [loadErr,   setLoadErr]   = useState(null);
  const [scoresOpen,setScoresOpen]= useState(false);
  const [activeTab,   setActiveTab]   = useState('away');
  const [teamSubTab,  setTeamSubTab]  = useState('stats');
  const [drivesSubTab,setDrivesSubTab]= useState('byteam');

  // ── initial load ────────────────────────────────────────────────────────────
  useEffect(() => {
    if (!gameId) { setLoading(false); return; }
    (async () => {
      try {
        const teamFields = 'nombre_corto,abreviatura,Escuela,color_principal,color_texto,logo_url';
        const [gArr, pArr] = await Promise.all([
          sbFetch(`games?select=*,home:home_team_id(${teamFields}),away:away_team_id(${teamFields})&id=eq.${encodeURIComponent(gameId)}&limit=1`),
          sbFetch(`plays?select=*&game_id=eq.${encodeURIComponent(gameId)}&order=seq.asc`),
          engineReady,
        ]);
        const g = gArr[0] || null;
        setGame(g);
        setPlays((pArr || []).map(_flattenPlay));
        if (g?.semana) {
          const wArr = await sbFetch(`games?select=id,status,score_home,score_away,hora,home:home_team_id(nombre_corto,abreviatura,logo_url),away:away_team_id(nombre_corto,abreviatura,logo_url)&semana=eq.${encodeURIComponent(g.semana)}&order=kickoff.asc.nullslast`);
          setWeekGames(wArr || []);
        }
      } catch (e) {
        setLoadErr(e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // ── realtime ────────────────────────────────────────────────────────────────
  useEffect(() => {
    if (!gameId || !game) return;
    let sbClient;
    (async () => {
      try {
        await configReady;
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        sbClient = createClient(SB_URL, SB_KEY, { db: { schema: 'covercero' } });
        sbClient.channel('viewer-plays')
          .on('postgres_changes', {
            event: 'INSERT', schema: 'covercero', table: 'plays',
            filter: `game_id=eq.${gameId}`,
          }, payload => {
            setPlays(prev => [...prev, _flattenPlay(payload.new)]);
          })
          .subscribe();
      } catch (e) {
        console.warn('[viewer] realtime init failed:', e.message);
      }
    })();
    return () => { if (sbClient) sbClient.removeAllChannels(); };
  }, [game?.id]);

  // ── derived state (always computed, so hook order never changes across renders) ──
  const { home, away } = game || {};
  const homeAbbr  = home?.abreviatura || '';
  const awayAbbr  = away?.abreviatura || '';
  const homeColor = home?.color_principal || '#3b82f6';
  const awayColor = away?.color_principal || '#f97316';
  const isLive    = game?.status === 'live';
  const isFinal   = game?.status === 'final';

  const drives = useMemo(() => computeDrives(plays, homeAbbr, awayAbbr), [plays, homeAbbr, awayAbbr]);

  const { passers, rushers, receivers } = useMemo(() => {
    const pa = {}, ru = {}, re = {};

    for (const p of plays) {
      const t = p.possession;
      if (t !== homeAbbr && t !== awayAbbr) continue;
      // A play voided by an accepted penalty (stats_count: false, set by
      // wizard.js at save time) isn't a real attempt for anyone involved —
      // excluded from RUSHING/PASSING/RECEIVING entirely, not just judged
      // by its (now-zero) net_yards.
      if (p.stats_count === false) continue;

      if (p.play_type === 'RUSH') {
        const yds = p.net_yards || 0;
        const key = p.rush_by ? playerLabel(p.rush_by) : 'Desconocido';
        if (!ru[t]) ru[t] = {};
        if (!ru[t][key]) ru[t][key] = { att:0, yds:0, td:0 };
        ru[t][key].att++;
        ru[t][key].yds += yds;
        if (p.touchdown) ru[t][key].td++;
      }

      // NCAA convention: a QB scramble or a sack is a rushing play credited
      // to the QB (pass_by), not a passing attempt — the ball was never
      // thrown either way, so both are folded into the RUSHING breakdown
      // instead of PASSING (matches computeComparisonStats' Rush Yds and the
      // isAttempt filter computeQBProgression already used for att/comp%).
      if (p.play_type === 'PASS' && (p.pass_result === 'scramble' || p.pass_result === 'sack')) {
        const yds = p.net_yards || 0;
        const key = p.pass_by ? playerLabel(p.pass_by) : 'Desconocido';
        if (!ru[t]) ru[t] = {};
        if (!ru[t][key]) ru[t][key] = { att:0, yds:0, td:0 };
        ru[t][key].att++;
        ru[t][key].yds += yds;
        if (p.touchdown) ru[t][key].td++;
      }

      if (p.play_type === 'PASS' && p.pass_result !== 'scramble' && p.pass_result !== 'sack') {
        const key = p.pass_by ? playerLabel(p.pass_by) : 'Desconocido';
        if (!pa[t]) pa[t] = {};
        if (!pa[t][key]) pa[t][key] = { att:0, comp:0, yds:0, td:0 };
        pa[t][key].att++;
        if (p.pass_result === 'complete') {
          const yds = p.net_yards || 0;
          pa[t][key].comp++;
          pa[t][key].yds += yds;
          if (p.touchdown) pa[t][key].td++;
          if (p.received_by) {
            const rk = playerLabel(p.received_by);
            if (!re[t]) re[t] = {};
            if (!re[t][rk]) re[t][rk] = { rec:0, yds:0, td:0 };
            re[t][rk].rec++;
            re[t][rk].yds += yds;
            if (p.touchdown) re[t][rk].td++;
          }
        }
      }
    }
    return { passers: pa, rushers: ru, receivers: re };
  }, [plays, homeAbbr, awayAbbr]);

  const scoringEvents = useMemo(() => computeScoringPlays(plays, homeAbbr, awayAbbr), [plays, homeAbbr, awayAbbr]);

  const penalties = useMemo(() => computePenalties(plays, homeAbbr), [plays, homeAbbr]);

  const specialTeamsStats = useMemo(() => {
    const teams = { home: { name: homeAbbr }, away: { name: awayAbbr } };
    return computeSpecialTeamsStats(plays, homeAbbr, awayAbbr, teams);
  }, [plays, homeAbbr, awayAbbr]);

  const { apRows, fumbleRows } = useMemo(() => {
    const teams = { home: { name: homeAbbr }, away: { name: awayAbbr } };
    const turnoverReturns = computeTurnoverReturnYards(plays, homeAbbr, awayAbbr, teams);
    const apMap = computeAllPurposeMap(
      rushers, receivers, specialTeamsStats.kickReturns, specialTeamsStats.puntReturns,
      turnoverReturns, homeAbbr, awayAbbr
    );
    const fumbleMap = fumbleStatsToMap(computeFumbleStats(plays), homeAbbr, awayAbbr);
    return {
      apRows:     buildRows(apMap, ['RUN','RCV','KR','PR','FR/IR','TOT'], d => [d.run, d.rcv, d.kr, d.pr, d.frir, d.total]),
      fumbleRows: buildRows(fumbleMap, ['NO','LOST'], d => [d.no, d.lost]),
    };
  }, [plays, homeAbbr, awayAbbr, rushers, receivers, specialTeamsStats]);

  const defenseStats = useMemo(() => computeDefenseStats(plays, homeAbbr, awayAbbr), [plays, homeAbbr, awayAbbr]);
  const qbProgression = useMemo(() => computeQBProgression(plays), [plays]);
  const explosivePlays = useMemo(() => {
    const teams = { home: { name: homeAbbr }, away: { name: awayAbbr } };
    return computeExplosivePlays(plays, teams);
  }, [plays, homeAbbr, awayAbbr]);
  const driveRows = useMemo(() => {
    const teams = { home: { name: homeAbbr }, away: { name: awayAbbr } };
    return computeDriveRows(drives, teams);
  }, [drives, homeAbbr, awayAbbr]);

  // ── no game_id ──────────────────────────────────────────────────────────────
  if (!gameId) return (
    <div style={{ minHeight:'100vh', background:'var(--bg)', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:14, fontFamily:"'Inter',sans-serif" }}>
      <div style={{ fontSize:26, fontWeight:700, color:'var(--text2)', letterSpacing:1 }}>No se especificó un partido.</div>
      <a href="index.html" style={{ color:'var(--text2)', fontSize:15, textDecoration:'none' }}>← Todos los partidos</a>
    </div>
  );

  if (loading) return <SkeletonLoader />;

  if (loadErr || !game) return (
    <div style={{ minHeight:'100vh', background:'var(--bg)', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:14, fontFamily:"'Inter',sans-serif" }}>
      <div style={{ fontSize:26, fontWeight:700, color:'#dc2626' }}>Partido no encontrado</div>
      {loadErr && <div style={{ fontSize:12, color:'var(--text3)', fontFamily:"'Inter',sans-serif" }}>{loadErr}</div>}
      <a href="index.html" style={{ color:'var(--text2)', fontSize:15, textDecoration:'none' }}>← Todos los partidos</a>
    </div>
  );

  // ── derived from plays ───────────────────────────────────────────────────────
  const lastPlay = plays.length ? plays[plays.length - 1] : null;
  const { home: scoreHome, away: scoreAway } =
    computeCurrentScore(lastPlay, game.score_home ?? 0, game.score_away ?? 0, homeAbbr, awayAbbr);

  // Per-quarter cumulative scores. Same pre-play-snapshot issue as the main
  // scoreboard: a quarter's last play can itself be the scoring play, so its
  // stored score_home/score_away (pre-play) undercounts that quarter unless
  // replayed through computeCurrentScore() the same way.
  function qScores(teamKey) {
    const out = [0,0,0,0];
    let prev = { home:0, away:0 };
    for (let q = 1; q <= 4; q++) {
      const qp = plays.filter(p => p.quarter === q);
      if (qp.length) {
        const lp = qp[qp.length - 1];
        const { home: sh, away: sa } = computeCurrentScore(lp, prev.home, prev.away, homeAbbr, awayAbbr);
        out[q-1] = teamKey === 'home' ? sh - prev.home : sa - prev.away;
        prev = { home: sh, away: sa };
      }
    }
    return out;
  }
  const qScoreHome = qScores('home');
  const qScoreAway = qScores('away');

  // Situation from last non-GAME_CTRL play
  const sitPlay = [...plays].reverse().find(p => p.play_type !== 'GAME_CTRL');
  const situation = sitPlay ? {
    possession: sitPlay.possession,
    down: sitPlay.down,
    distance: sitPlay.distance,
    field_pos: sitPlay.field_pos,
  } : null;

  // Current drive summary
  const currentDrive  = drives.length ? drives[drives.length - 1] : null;
  const drivePlayCount = currentDrive?.plays.length || 0;
  const driveYards    = currentDrive?.plays.reduce((a,p) => a + (p.net_yards||0), 0) || 0;

  function buildRows(dataMap, cols, keyFn) {
    const rows = [];
    for (const abbr of [awayAbbr, homeAbbr]) {
      const td = dataMap[abbr];
      if (!td || !Object.keys(td).length) continue;
      const color = abbr === homeAbbr ? homeColor : awayColor;
      rows.push({ isHeader: true, name: abbr, color, team: abbr });
      Object.entries(td).forEach(([name, d]) => {
        rows.push({ name, vals: keyFn(d), team: abbr });
      });
    }
    return rows;
  }

  const passRows = buildRows(passers,  ['ATT','COMP','YDS','TD'], d => [d.att, d.comp, d.yds, d.td]);
  const rushRows = buildRows(rushers,  ['ATT','YDS','TD'],        d => [d.att, d.yds, d.td]);
  const recRows  = buildRows(receivers,['REC','YDS','TD'],        d => [d.rec, d.yds, d.td]);

  // Labels depend on the loaded game's real team abbreviations, so this
  // can't be a module-level constant like the old TABS list was.
  const mainTabs = [
    { key: 'away',    label: `${awayAbbr} Stats` },
    { key: 'home',    label: `${homeAbbr} Stats` },
    { key: 'compare', label: 'Comparación' },
    { key: 'drives',  label: 'Drives' },
    { key: 'scoring', label: 'Anotaciones' },
    { key: 'pbp',     label: 'Play by Play' },
  ];

  return (
    <div style={{ minHeight:'100vh', background:'var(--bg)', fontFamily:"'Inter',sans-serif", color:'var(--text)' }}>

      {/* ── UTILBAR ─────────────────────────────────────────────────────────── */}
      <div style={{ background:'var(--card-bg)', borderBottom:'1px solid var(--border2)', padding:'10px 20px', display:'flex', alignItems:'center', gap:14, position:'sticky', top:0, zIndex:100 }}>
        <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:20, color:'var(--text)', letterSpacing:1, flexShrink:0 }}>
          COVER<span style={{ color:'var(--accent)' }}>CERO</span>
        </span>
        <div style={{ width:1, height:18, background:'var(--border2)' }} />
        <span style={{ fontFamily:"'Inter',sans-serif", fontSize:13, color:'var(--text2)', letterSpacing:0.3, flexShrink:0 }}>
          {game.liga ? `${game.liga} · ` : ''}{fmtWeek(game.semana)}
        </span>

        {/* Scores toggle — centered */}
        <div style={{ flex:1, display:'flex', justifyContent:'center' }}>
          {weekGames.length > 0 && (
            <button onClick={() => setScoresOpen(o => !o)} style={{
              background:'transparent', border:'1px solid var(--border2)', borderRadius:5,
              color:'var(--text2)', fontFamily:"'Inter',sans-serif", fontWeight:700,
              fontSize:12, letterSpacing:1, padding:'4px 14px', cursor:'pointer',
            }}>
              SCORES {scoresOpen ? '▲' : '▼'}
            </button>
          )}
        </div>

        <a href="index.html" style={{ color:'var(--text2)', fontFamily:"'Inter',sans-serif", fontSize:13, fontWeight:600, textDecoration:'none', letterSpacing:0.3, flexShrink:0 }}>
          ← Todos los partidos
        </a>
      </div>

      {/* ── SCORES PANEL ────────────────────────────────────────────────────── */}
      {scoresOpen && weekGames.length > 0 && (
        <div style={{ background:'var(--card-bg)', borderBottom:'1px solid var(--border2)', padding:'0 20px' }}>
          <ScoresPanel games={weekGames} currentId={gameId} />
        </div>
      )}

      {/* ── SCOREBOARD HERO ─────────────────────────────────────────────────── */}
      <div style={{ background:'var(--bg)', padding:'28px 20px 20px', borderBottom:'1px solid var(--border)' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr auto 1fr', gap:16, maxWidth:920, margin:'0 auto', alignItems:'center' }}>

          {/* Away */}
          <div style={{ display:'flex', alignItems:'center', gap:14 }}>
            <TeamLogo team={away} size={72} />
            <div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:26, lineHeight:1, color:'var(--text)' }}>
                {away?.nombre_corto || awayAbbr}
              </div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:13, color:'var(--text2)', marginTop:2, letterSpacing:0.4 }}>
                {away?.Escuela || ''}
              </div>
            </div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:68, lineHeight:0.9, color:awayColor, marginLeft:'auto', fontVariantNumeric:'tabular-nums' }}>
              {scoreAway}
            </div>
          </div>

          {/* Center */}
          <div style={{ textAlign:'center', minWidth:190 }}>
            {isLive && (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:7, marginBottom:10 }}>
                <span style={{ width:8, height:8, borderRadius:'50%', background:'#dc2626', display:'inline-block', animation:'pulse 1.5s infinite' }} />
                <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:13, letterSpacing:2, color:'#dc2626' }}>EN VIVO</span>
                {lastPlay?.quarter && (
                  <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:13, color:'var(--text2)', border:'1.5px solid var(--border2)', padding:'1px 8px', borderRadius:3 }}>
                    Q{lastPlay.quarter}
                  </span>
                )}
                {lastPlay?.clock && (
                  <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:15, color:'var(--text)' }}>
                    {lastPlay.clock}
                  </span>
                )}
              </div>
            )}
            {isFinal && (
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:15, letterSpacing:2, color:'var(--text2)', marginBottom:10 }}>FINAL</div>
            )}
            {!isLive && !isFinal && (
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:13, color:'var(--text2)', marginBottom:10 }}>
                {fmtDate(game.kickoff, game.hora)}
              </div>
            )}

            {/* Quarter score table */}
            <table style={{ width:'100%', borderCollapse:'collapse', fontVariantNumeric:'tabular-nums', tableLayout:'fixed' }}>
              <thead>
                <tr>
                  <th style={{ fontFamily:"'Inter',sans-serif", fontSize:10, color:'var(--text3)', padding:'2px 2px', fontWeight:600, letterSpacing:0.5, textAlign:'left' }}></th>
                  {['1','2','3','4'].map(q => (
                    <th key={q} style={{ fontFamily:"'Inter',sans-serif", fontSize:10, color:'var(--text3)', padding:'2px 2px', fontWeight:600, letterSpacing:0.5 }}>{q}</th>
                  ))}
                  <th style={{ fontFamily:"'Inter',sans-serif", fontSize:10, color:'var(--text)', padding:'2px 2px', fontWeight:700 }}>T</th>
                </tr>
              </thead>
              <tbody>
                {[
                  { abbr: awayAbbr, qs: qScoreAway, total: scoreAway, color: awayColor },
                  { abbr: homeAbbr, qs: qScoreHome, total: scoreHome, color: homeColor },
                ].map(row => (
                  <tr key={row.abbr}>
                    <td style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:12, color:row.color, padding:'4px 2px', textAlign:'left' }}>{row.abbr}</td>
                    {row.qs.map((q, i) => (
                      <td key={i} style={{ fontFamily:"'Inter',sans-serif", fontSize:12, padding:'4px 2px', textAlign:'center', color:'var(--text)' }}>{q}</td>
                    ))}
                    <td style={{ fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:16, textAlign:'center', color:row.color }}>{row.total}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            {/* Timeouts */}
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:8, padding:'0 2px' }}>
              <div style={{ display:'flex', gap:4 }}>{[0,1,2].map(i => <span key={i} style={{ fontSize:9, color:awayColor }}>●</span>)}</div>
              <div style={{ display:'flex', gap:4 }}>{[0,1,2].map(i => <span key={i} style={{ fontSize:9, color:homeColor }}>●</span>)}</div>
            </div>
          </div>

          {/* Home */}
          <div style={{ display:'flex', alignItems:'center', gap:14, justifyContent:'flex-end' }}>
            <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:68, lineHeight:0.9, color:homeColor, marginRight:'auto', fontVariantNumeric:'tabular-nums' }}>
              {scoreHome}
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:26, lineHeight:1, color:'var(--text)' }}>
                {home?.nombre_corto || homeAbbr}
              </div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:13, color:'var(--text2)', marginTop:2, letterSpacing:0.4 }}>
                {home?.Escuela || ''}
              </div>
            </div>
            <TeamLogo team={home} size={72} />
          </div>
        </div>
      </div>

      {/* ── SITUATION STRIP (live only) ──────────────────────────────────────── */}
      {isLive && situation && (
        <div style={{ background:'var(--card-bg)', borderBottom:'1px solid var(--border2)', padding:'12px 20px', display:'flex', alignItems:'center', gap:18, flexWrap:'wrap' }}>
          <div style={{
            display:'flex', alignItems:'center', gap:7, color:'#fff',
            padding:'6px 12px', borderRadius:3, flexShrink:0,
            background: situation.possession === homeAbbr ? homeColor : awayColor,
            fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:13, letterSpacing:1,
          }}>
            <span>●</span>
            <span>POSESIÓN · {situation.possession}</span>
          </div>

          {situation.down > 0 && (
            <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:9, letterSpacing:1.4, color:'var(--text3)', fontWeight:600 }}>DOWN &amp; DIST</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:20, color:'var(--text)', lineHeight:1 }}>
                {['','1°','2°','3°','4°'][situation.down] || `${situation.down}°`} &amp; {situation.distance}
              </div>
            </div>
          )}

          {situation.field_pos && (
            <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:9, letterSpacing:1.4, color:'var(--text3)', fontWeight:600 }}>POSICIÓN</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:20, color:'var(--text)', lineHeight:1 }}>
                {situation.field_pos.team} {situation.field_pos.yard}
              </div>
            </div>
          )}

          {drivePlayCount > 0 && (
            <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:9, letterSpacing:1.4, color:'var(--text3)', fontWeight:600 }}>DRIVE</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:16, color:'var(--text)', lineHeight:1 }}>
                {drivePlayCount} jug · {driveYards} yds
              </div>
            </div>
          )}

          <FieldStrip possession={situation.possession} fieldPos={situation.field_pos} home={home} away={away} />
        </div>
      )}

      {/* ── TABS ──────────────────────────────────────────────────────────────── */}
      <TabBar tabs={mainTabs} active={activeTab} onChange={setActiveTab} />

      {/* ── TAB CONTENT ───────────────────────────────────────────────────────── */}
      <div style={{ padding:'16px 20px 40px', maxWidth:1200, margin:'0 auto' }}>
        {activeTab === 'away' && (
          <TeamStatsTab
            teamAbbr={awayAbbr} teamColor={awayColor}
            subTab={teamSubTab} onSubTabChange={setTeamSubTab}
            passRows={passRows} rushRows={rushRows} recRows={recRows}
            defenseStats={defenseStats} qbProgression={qbProgression} explosivePlays={explosivePlays}
            specialTeamsStats={specialTeamsStats} penalties={penalties}
          />
        )}
        {activeTab === 'home' && (
          <TeamStatsTab
            teamAbbr={homeAbbr} teamColor={homeColor}
            subTab={teamSubTab} onSubTabChange={setTeamSubTab}
            passRows={passRows} rushRows={rushRows} recRows={recRows}
            defenseStats={defenseStats} qbProgression={qbProgression} explosivePlays={explosivePlays}
            specialTeamsStats={specialTeamsStats} penalties={penalties}
          />
        )}
        {activeTab === 'compare' && (
          <ComparisonTab plays={plays} drives={drives} home={home} away={away} homeAbbr={homeAbbr} awayAbbr={awayAbbr} />
        )}
        {activeTab === 'drives' && (
          <DrivesTab
            driveRows={driveRows} homeAbbr={homeAbbr} awayAbbr={awayAbbr} homeColor={homeColor} awayColor={awayColor}
            subTab={drivesSubTab} onSubTabChange={setDrivesSubTab}
          />
        )}
        {activeTab === 'scoring' && (
          <ScoringSummaryPanel events={scoringEvents} homeAbbr={homeAbbr} awayAbbr={awayAbbr} homeColor={homeColor} awayColor={awayColor} />
        )}
        {activeTab === 'pbp' && (
          <PlayByPlayTab drives={drives} homeAbbr={homeAbbr} awayAbbr={awayAbbr} homeColor={homeColor} awayColor={awayColor} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
