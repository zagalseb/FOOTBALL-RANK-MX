<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Cero Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --bg2: #13161b;
      --bg3: #1a1e25;
      --border: #252a33;
      --border2: #2e3540;
      --text: #e8eaed;
      --text2: #8a95a3;
      --text3: #4a5568;
      --accent: #3b82f6;
      --accent-bg: rgba(59,130,246,0.12);
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.12);
      --yellow: #eab308;
      --yellow-bg: rgba(234,179,8,0.12);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.12);
      --orange: #f97316;
      --orange-bg: rgba(249,115,22,0.12);
      --purple: #a855f7;
      --purple-bg: rgba(168,85,247,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .topbar__brand {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .topbar__divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .topbar__stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .topbar__stat-label {
      font-size: 9px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .topbar__stat-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar__nav {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-btn:hover {
      background: var(--bg3);
      color: var(--text);
      border-color: var(--border2);
    }

    .nav-btn--active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── MAIN LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar__header {
      padding: 8px 8px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar__plays {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar__empty {
      padding: 20px 16px;
      font-size: 12px;
      color: var(--text3);
      text-align: center;
    }

    .recent-play {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .recent-play:hover { background: var(--bg3); }

    .recent-play__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .recent-play__seq {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text3);
    }

    .recent-play__type {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }

    .recent-play__edit {
      font-size: 10px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }

    .recent-play__edit:hover {
      background: var(--bg3);
      color: var(--text2);
    }

    .recent-play__meta {
      font-size: 10px;
      color: var(--text3);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── CONTENT AREA ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .possession-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .possession-bar__text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .possession-bar__dot {
      color: var(--text3);
    }

    .wizard-area {
      flex: 1;
      padding: 32px 24px;
      overflow-y: auto;
    }

    .wizard-area__title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    /* ── PLAY GRID ── */
    .play-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 480px;
    }

    .play-btn {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
      position: relative;
    }

    .play-btn:hover:not([disabled]) {
      background: var(--bg2);
      border-color: var(--accent);
    }

    .play-btn:active:not([disabled]) {
      transform: scale(0.97);
    }

    .play-btn--disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .play-btn__label {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .play-btn__key {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: var(--border2);
      color: var(--text2);
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      min-width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .play-btn:not([disabled]):hover .play-btn__key {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── TYPE COLORS ── */
    .type-rush    { color: var(--green); }
    .type-pass    { color: var(--accent); }
    .type-penalty { color: var(--yellow); }
    .type-punt    { color: var(--purple); }
    .type-kick    { color: var(--purple); }
    .type-pat_try { color: var(--orange); }

    /* ── PROGRESS BAR ── */
    #step-progress { margin-bottom: 20px; }

    .progress-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .progress-step {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid transparent;
      line-height: 1.4;
    }

    .progress-step--done {
      background: var(--bg3);
      border-color: var(--border2);
      color: var(--text2);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .progress-step--done:hover {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-step--active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-step--future {
      background: transparent;
      border-color: var(--border);
      color: var(--text3);
    }

    .progress-sep {
      color: var(--text3);
      font-size: 13px;
      padding: 0 2px;
      user-select: none;
    }

    /* ── BY MENU ── */
    .by-menu { max-width: 480px; }

    .by-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .by-input {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 14px;
      width: 180px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .by-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }

    .by-input::placeholder {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--text3);
    }

    .btn-skip {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      transition: background 0.15s;
    }

    .btn-skip:hover { background: var(--bg3); }

    /* ── PLAYER PILLS ── */
    .by-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .player-pill {
      background: var(--accent-bg);
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-pill__remove {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
      opacity: 0.6;
      transition: opacity 0.1s;
    }

    .player-pill__remove:hover { opacity: 1; }

    .by-hint {
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 8px;
    }

    /* ── PLAYER GRID ── */
    .by-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
      padding: 2px 0 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .player-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 54px;
      transition: background 0.1s, border-color 0.1s;
    }

    .player-btn:hover {
      background: var(--bg2);
      border-color: var(--border2);
    }

    .player-btn--selected {
      background: var(--accent-bg);
      border-color: var(--accent);
    }

    .player-btn--highlighted {
      background: var(--accent-bg);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
    }

    .player-btn__num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
    }

    .player-btn__pos {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 9px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-continue {
      margin-top: 12px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      display: block;
      transition: opacity 0.15s;
    }

    .btn-continue:hover { opacity: 0.85; }

    /* ── PLACEHOLDER ── */
    .placeholder-step {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 400px;
    }

    .placeholder-step__msg {
      font-size: 15px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .placeholder-step__detail {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text3);
    }

    .badge-coming {
      font-size: 10px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text3);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 500;
    }

    .btn-back {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      width: fit-content;
      transition: background 0.15s, color 0.15s;
    }

    .btn-back:hover {
      background: var(--bg2);
      color: var(--text);
    }

    /* ── RESULT MENU ── */
    .result-menu {
      display: flex;
      gap: 10px;
      max-width: 700px;
    }

    .result-btn {
      flex: 1;
      min-height: 80px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-color);
      border-radius: 10px;
      color: var(--btn-color);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 10px;
      transition: box-shadow 0.12s, filter 0.12s, transform 0.08s;
    }

    .result-btn:hover {
      filter: brightness(1.18);
      box-shadow: 0 0 0 1px var(--btn-color);
    }

    .result-btn:active {
      transform: scale(0.96);
    }

    .result-btn--yellow { --btn-color: var(--yellow); --btn-bg: var(--yellow-bg); }
    .result-btn--accent { --btn-color: var(--accent); --btn-bg: var(--accent-bg); }
    .result-btn--muted  { --btn-color: var(--text2);  --btn-bg: var(--bg3);       }
    .result-btn--orange { --btn-color: var(--orange); --btn-bg: var(--orange-bg); }
    .result-btn--red    { --btn-color: var(--red);    --btn-bg: var(--red-bg);    }
    .result-btn--green  { --btn-color: var(--green);  --btn-bg: var(--green-bg);  }
    .result-btn--purple { --btn-color: var(--purple); --btn-bg: var(--purple-bg); }

    .result-btn__label {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    .result-btn__kbd {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,0,0,0.2);
      color: currentColor;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid currentColor;
      opacity: 0.7;
    }
  
    /* ── AT FIELD ── */
    .at-field { max-width: 480px; display: flex; flex-direction: column; gap: 10px; }

    .at-team-hint {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .at-team-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 5px;
      padding: 3px 8px;
    }

    .at-snap-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
    }

    .at-input-row { display: flex; align-items: center; gap: 8px; }

    .at-input {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      padding: 10px 16px;
      width: 180px;
      outline: none;
      letter-spacing: 0.05em;
      transition: border-color 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }

    .at-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }

    .at-input--td {
      border-color: var(--green);
      box-shadow: 0 0 0 2px var(--green-bg);
      color: var(--green);
    }

    .at-input::placeholder {
      font-size: 13px;
      font-weight: 400;
      color: var(--text3);
      letter-spacing: 0;
    }

    .at-feedback {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .at-feedback--hint  { color: var(--text3); background: transparent; }
    .at-feedback--valid { color: var(--text2);  background: var(--bg3); border: 1px solid var(--border2); }
    .at-feedback--invalid { color: var(--red);  background: var(--red-bg); border: 1px solid var(--red); }
    .at-feedback--td    {
      color: var(--green);
      background: var(--green-bg);
      border: 1px solid var(--green);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .at-net { color: var(--green); font-weight: 600; }
    .at-feedback--valid .at-net[data-neg] { color: var(--red); }

    .at-feedback code {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--accent);
    }

  
    /* ── SUBMIT SCREEN ── */
    .submit-screen {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 640px;
    }

    .submit-play-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 18px 20px;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    .submit-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .submit-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      transition: opacity 0.15s, filter 0.15s;
      border: 1px solid transparent;
    }

    .submit-btn:hover { filter: brightness(1.12); }
    .submit-btn:active { opacity: 0.8; }

    .submit-btn--confirm {
      background: var(--green);
      color: #000;
      border-color: var(--green);
    }

    .submit-btn--penalty {
      background: var(--yellow-bg);
      color: var(--yellow);
      border-color: var(--yellow);
    }

    .submit-btn--cancel {
      background: transparent;
      color: var(--text3);
      border-color: var(--border2);
    }

    .submit-btn--cancel:hover {
      color: var(--text2);
      border-color: var(--border);
      filter: none;
      background: var(--bg3);
    }

    .submit-kbd {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid currentColor;
      opacity: 0.7;
    }

    /* ── SIDEBAR QTABS ── */
    .sidebar__qtabs {
      display: flex;
      gap: 2px;
      width: 100%;
    }

    .qtab {
      flex: 1;
      height: 28px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text3);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s;
      padding: 0;
    }

    .qtab:hover { color: var(--text2); }

    .qtab--active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── PLAY ROWS ── */
    .play-row {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .play-row:hover { background: var(--bg3); }

    .play-row--editing {
      background: var(--accent-bg);
      border-left: 2px solid var(--accent);
    }

    .play-row__main {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text);
    }

    .play-row__meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text3);
    }

    .play-row__seq {
      color: var(--text3);
      min-width: 20px;
    }

    /* ── EDIT PANEL ── */
    .edit-panel {
      background: var(--bg3);
      border-bottom: 1px solid var(--border2);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edit-panel__title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .edit-field label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .edit-input {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 5px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
      width: 100%;
    }

    .edit-input:focus { border-color: var(--accent); }

    .edit-actions {
      display: flex;
      gap: 6px;
    }

    .edit-btn {
      flex: 1;
      height: 28px;
      border-radius: 5px;
      font-family: 'IBM Plex Sans', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }

    .edit-btn:hover { opacity: 0.85; }

    .edit-btn--save {
      background: var(--accent);
      color: #fff;
    }

    .edit-btn--cancel {
      background: transparent;
      border-color: var(--border2);
      color: var(--text2);
    }

    .penalty-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 280px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .penalty-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .penalty-item:hover,
    .penalty-item--match { background: var(--bg3); }
    .penalty-item__code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      min-width: 28px;
    }
    .penalty-item__label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text2);
    }

    /* ── BACK LINK ── */
    .topbar__back {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text2);
      text-decoration: none;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .topbar__back:hover { color: var(--text); }

    /* ── GAME ID + SYNC ── */
    .topbar__gameid-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* ── NO GAME ERROR ── */
    .no-game-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      gap: 16px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .no-game-overlay__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text2);
    }

    .no-game-overlay__link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }

    .no-game-overlay__link:hover { text-decoration: underline; }

    .sync-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      color: var(--text3);
      transition: color 0.2s, background 0.2s;
    }

    .sync-status--saving { color: var(--accent); }
    .sync-status--saved  { color: var(--green); }
    .sync-status--error  { color: var(--red); background: var(--red-bg); }

  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <span class="topbar__brand">COVER CERO LIVE</span>
    <div class="topbar__divider"></div>
    <a class="topbar__back" href="games.html">← Partidos</a>
    <div class="topbar__divider"></div>
    <div class="topbar__stat">
      <span class="topbar__stat-label">Game ID</span>
      <span class="topbar__gameid-value" id="gameid-display">—</span>
    </div>
    <span id="sync-status" class="sync-status"></span>
    <div class="topbar__divider"></div>
    <div class="topbar__stat">
      <span class="topbar__stat-label">Clock</span>
      <span class="topbar__stat-value" id="hud-clock">15:00</span>
    </div>
    <div class="topbar__stat">
      <span class="topbar__stat-label">Quarter</span>
      <span class="topbar__stat-value" id="hud-quarter">1</span>
    </div>
    <div class="topbar__stat">
      <span class="topbar__stat-label" id="hud-home-name">MTY</span>
      <span class="topbar__stat-value" id="hud-score-home">0</span>
    </div>
    <div class="topbar__stat">
      <span class="topbar__stat-label" id="hud-away-name">UANL</span>
      <span class="topbar__stat-value" id="hud-score-away">0</span>
    </div>
    <div class="topbar__stat">
      <span class="topbar__stat-label">Down</span>
      <span class="topbar__stat-value" id="hud-down">1st</span>
    </div>
    <div class="topbar__stat">
      <span class="topbar__stat-label">Distance</span>
      <span class="topbar__stat-value" id="hud-distance">10</span>
    </div>
    <nav class="topbar__nav">
      <button class="nav-btn nav-btn--active">Add Play</button>
      <button class="nav-btn">Reports</button>
      <button class="nav-btn">Rosters</button>
      <button class="nav-btn">Setup</button>
    </nav>
  </header>

  <!-- MAIN -->
  <div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <div class="sidebar__qtabs" id="sidebar-qtabs"></div>
      </div>
      <div class="sidebar__plays" id="sidebar-plays"></div>
    </aside>

    <!-- CONTENT -->
    <div class="content">
      <div class="possession-bar">
        <span class="possession-bar__text" id="poss-team">MTY</span>
        <span class="possession-bar__dot">·</span>
        <span class="possession-bar__text" id="poss-down-dist">1st and 10</span>
        <span class="possession-bar__dot">·</span>
        <span class="possession-bar__text" id="poss-field">MTY 35</span>
      </div>

      <div class="wizard-area">
        <div id="step-progress"></div>
        <div id="wizard-container"></div>
      </div>
    </div>

  </div>

  <script type="module">
    import { renderAddPlay } from './wizard.js'
    import { loadPlays, plays, savePlays, gameState, onPlaySubmitted,
             setSupabaseClient, setGameId, getGameId, onSyncStatus } from './engine.js'

    const DOWN_LABELS = ['', '1st', '2nd', '3rd', '4th']

    // ── Supabase setup ─────────────────────────────────────────────────────────

    try {
      const mod = await import('./supabase_config.js')
      setSupabaseClient(mod.supabase)
    } catch (e) {
      console.warn('[Cover Cero] Supabase not available:', e.message)
    }

    // Read game_id: URL → localStorage → error overlay
    const _urlGameId = new URLSearchParams(window.location.search).get('game_id')
    const _localGameId = localStorage.getItem('covercero_game_id')
    const _activeGameId = _urlGameId || _localGameId

    if (!_activeGameId) {
      document.body.insertAdjacentHTML('beforeend', `
        <div class="no-game-overlay">
          <div class="no-game-overlay__title">No se especificó un partido.</div>
          <a class="no-game-overlay__link" href="games.html">← Ir a la lista de partidos</a>
        </div>
      `)
    } else {
      setGameId(_activeGameId)
      document.getElementById('gameid-display').textContent = _activeGameId

      // Fetch game + teams from Supabase
      const SB_URL  = 'https://hqjxblblbmahqltjikfy.supabase.co'
      const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxanhibGJsYm1haHFsdGppa2Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzI4NjMsImV4cCI6MjA5NDQ0ODg2M30.4NbgHPtA88Of-kIB-gwrr-Ry1_IxJF43cl4peLPEU_M'
      try {
        const res = await fetch(
          `${SB_URL}/rest/v1/games?select=*,home:home_team_id(nombre_corto,abreviatura),away:away_team_id(nombre_corto,abreviatura)&id=eq.${encodeURIComponent(_activeGameId)}&limit=1`,
          { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Accept-Profile': 'covercero', 'Content-Profile': 'covercero' } }
        )
        if (res.ok) {
          const [game] = await res.json()
          if (game?.home && game?.away) {
            const homeAbbr = game.home.abreviatura || game.home.nombre_corto
            const awayAbbr = game.away.abreviatura || game.away.nombre_corto
            gameState.teams.home.name   = homeAbbr
            gameState.teams.home.prefix = homeAbbr[0].toUpperCase()
            gameState.teams.away.name   = awayAbbr
            gameState.teams.away.prefix = awayAbbr[0].toUpperCase()
            gameState.possession        = homeAbbr
            gameState.field_pos         = { team: homeAbbr, yard: 35 }
          }
        }
      } catch (e) {
        console.warn('[Cover Cero] Could not load game data:', e.message)
      }
    }

    const _syncEl = document.getElementById('sync-status')
    onSyncStatus((status) => {
      _syncEl.className = `sync-status sync-status--${status}`
      _syncEl.textContent = {
        saving: '● Guardando',
        saved:  '✓ Guardado',
        error:  '⚠ Error sync',
      }[status] || ''
    })

    // ── Init ───────────────────────────────────────────────────────────────────

    loadPlays()
    renderAddPlay()
    renderHUD()

    let _activeQTab = gameState.quarter

    function renderSidebar() {
      _renderQTabs()
      _renderPlayList()
    }

    function _renderQTabs() {
      const quarters = ['Q1', 'Q2', 'Q3', 'Q4', 'OT']
      const container = document.getElementById('sidebar-qtabs')
      if (!container) return

      container.innerHTML = quarters.map(q => {
        const qVal = q === 'OT' ? 'OT' : parseInt(q[1])
        const isActive = _activeQTab === qVal
        return `<button class="qtab${isActive ? ' qtab--active' : ''}" data-q="${qVal}">${q}</button>`
      }).join('')

      container.querySelectorAll('.qtab').forEach(btn => {
        btn.addEventListener('click', () => {
          _activeQTab = isNaN(parseInt(btn.dataset.q)) ? btn.dataset.q : parseInt(btn.dataset.q)
          _renderQTabs()
          _renderPlayList()
        })
      })
    }

    function _playShortText(p) {
      const TYPE_LABEL = {
        RUSH: () => {
          const num  = p.rush_by ? `#${p.rush_by.number}` : '—'
          const name = p.rush_by?.name || ''
          const yds  = p.net_yards != null
            ? (p.net_yards >= 0 ? `+${p.net_yards}` : `${p.net_yards}`) + 'yds'
            : ''
          const res  = p.result ? p.result.toUpperCase() : ''
          return [num, name, yds, res].filter(Boolean).join(' ')
        },
        PASS: () => {
          const passer = p.pass_by ? `#${p.pass_by.number}` : '—'
          const res = p.pass_result
          if (res === 'complete') {
            const rec = p.received_by ? `→ #${p.received_by.number}` : ''
            const yds = p.net_yards != null
              ? (p.net_yards >= 0 ? `+${p.net_yards}` : `${p.net_yards}`) + 'yds'
              : ''
            return [passer, rec, yds].filter(Boolean).join(' ')
          }
          if (res === 'sack')        return `${passer} SACK`
          if (res === 'incomplete')  return `${passer} INCOMPLETE`
          if (res === 'dropped')     return `${passer} DROPPED`
          if (res === 'broken_up')   return `${passer} BROKEN UP`
          if (res === 'intercepted') return `${passer} INT`
          if (res === 'scramble')    return `${passer} SCRAMBLE`
          return `${passer} PASS`
        },
        PENALTY: () => {
          const team = p.penalty_team || '—'
          const res  = p.penalty_result
            ? p.penalty_result.charAt(0).toUpperCase() + p.penalty_result.slice(1)
            : ''
          return `PENALTY ${team} ${res}`.trim()
        },
        KICK: () => {
          if (p.kick_type === 'field_goal') {
            const res  = p.fg_result ? p.fg_result.toUpperCase() : ''
            const dist = p.kick_distance ? `${p.kick_distance}yds` : ''
            return `FG ${res} ${dist}`.trim()
          }
          const res = p.kickoff_result
            ? p.kickoff_result.replace('_', ' ').toUpperCase()
            : ''
          return `KICKOFF ${res}`.trim()
        },
        PAT_TRY: () => {
          const res = p.pat_result ? p.pat_result.toUpperCase() : ''
          return `PAT ${res}`
        },
        PUNT: () => 'PUNT',
      }
      const fn = TYPE_LABEL[p.play_type]
      return fn ? fn() : p.play_type
    }

    function _renderPlayList() {
      const container = document.getElementById('sidebar-plays')
      if (!container) return

      const filtered = plays.filter(p => p.quarter === _activeQTab).slice().reverse()

      if (!filtered.length) {
        container.innerHTML = '<div class="sidebar__empty">Sin jugadas</div>'
        return
      }

      const TYPE_CLASS = {
        RUSH: 'type-rush', PASS: 'type-pass', PENALTY: 'type-penalty',
        PUNT: 'type-punt', KICK: 'type-kick', PAT_TRY: 'type-pat_try',
      }

      container.innerHTML = filtered.map(p => {
        const fp  = p.field_pos ? `${p.field_pos.team} ${p.field_pos.yard}` : '—'
        const dn  = p.play_type === 'KICK' ? (p.kick_type === 'field_goal' ? 'FG' : 'Kickoff')
                  : p.play_type === 'PAT_TRY' ? 'PAT'
                  : p.down === 0 ? '—'
                  : DOWN_LABELS[p.down] ? `${DOWN_LABELS[p.down]} & ${p.distance}`
                  : '—'
        const tc  = TYPE_CLASS[p.play_type] || ''
        const txt = _playShortText(p)
        return `
          <div class="play-row" data-play-id="${p.play_id}">
            <div class="play-row__main">
              <span class="play-row__seq">#${p.seq}</span>
              <span class="recent-play__type ${tc}">${p.play_type}</span>
              <span>${txt}</span>
            </div>
            <div class="play-row__meta">${p.clock || '—'} · ${fp} · ${dn}</div>
          </div>
        `
      }).join('')

      container.querySelectorAll('.play-row').forEach(row => {
        row.addEventListener('click', () => _openEditPanel(row.dataset.playId))
      })
    }

    function _openEditPanel(playId) {
      const existing = document.querySelector('.edit-panel')
      if (existing) {
        const existingId = existing.dataset.editId
        existing.remove()
        document.querySelectorAll('.play-row--editing').forEach(r => r.classList.remove('play-row--editing'))
        if (existingId === playId) return
      }

      const play = plays.find(p => p.play_id === playId)
      if (!play) return
      const row = document.querySelector(`.play-row[data-play-id="${playId}"]`)
      if (!row) return
      row.classList.add('play-row--editing')

      const quarters = ['Q1', 'Q2', 'Q3', 'Q4', 'OT']
      const teamOpts = [gameState.teams.home.name, gameState.teams.away.name]
        .map(t => `<option value="${t}" ${play.possession === t ? 'selected' : ''}>${t}</option>`)
        .join('')
      const qOpts = quarters.map(q => {
        const val = q === 'OT' ? 'OT' : parseInt(q[1])
        return `<option value="${val}" ${play.quarter === val ? 'selected' : ''}>${q}</option>`
      }).join('')
      const fp = play.field_pos ? `${play.field_pos.team} ${play.field_pos.yard}` : ''

      const panel = document.createElement('div')
      panel.className = 'edit-panel'
      panel.dataset.editId = playId
      panel.innerHTML = `
        <div class="edit-panel__title">#${play.seq} — Editar contexto</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          <div class="edit-field">
            <label>Clock</label>
            <input class="edit-input" id="edit-clock" value="${play.clock || ''}">
          </div>
          <div class="edit-field">
            <label>Quarter</label>
            <select class="edit-input" id="edit-quarter">${qOpts}</select>
          </div>
          <div class="edit-field">
            <label>Field Pos</label>
            <input class="edit-input" id="edit-fp" value="${fp}">
          </div>
          <div class="edit-field">
            <label>Possession</label>
            <select class="edit-input" id="edit-poss">${teamOpts}</select>
          </div>
          <div class="edit-field">
            <label>Down</label>
            <input class="edit-input" type="number" id="edit-down" min="0" max="4" value="${play.down ?? ''}">
          </div>
          <div class="edit-field">
            <label>Distance</label>
            <input class="edit-input" type="number" id="edit-dist" min="0" max="99" value="${play.distance ?? ''}">
          </div>
        </div>
        <div class="edit-actions">
          <button class="edit-btn edit-btn--save" id="edit-save">Guardar</button>
          <button class="edit-btn edit-btn--cancel" id="edit-cancel">Cancelar</button>
        </div>
      `

      row.insertAdjacentElement('afterend', panel)

      document.getElementById('edit-save').addEventListener('click', () => {
        const fpRaw  = document.getElementById('edit-fp').value.trim().split(' ')
        const fpTeam = fpRaw[0] || play.field_pos?.team
        const fpYard = parseInt(fpRaw[1]) || play.field_pos?.yard
        const qRaw   = document.getElementById('edit-quarter').value

        play.clock      = document.getElementById('edit-clock').value
        play.quarter    = isNaN(parseInt(qRaw)) ? qRaw : parseInt(qRaw)
        play.field_pos  = { team: fpTeam, yard: fpYard }
        play.possession = document.getElementById('edit-poss').value
        play.down       = parseInt(document.getElementById('edit-down').value) || 0
        play.distance   = parseInt(document.getElementById('edit-dist').value) || 0

        savePlays()
        panel.remove()
        row.classList.remove('play-row--editing')
        _renderPlayList()
      })

      document.getElementById('edit-cancel').addEventListener('click', () => {
        panel.remove()
        row.classList.remove('play-row--editing')
      })
    }

    function renderHUD() {
      const { down, distance, field_pos, possession, clock, quarter, score, teams } = gameState

      // Down & Distance
      const downEl = document.getElementById('hud-down')
      const distEl = document.getElementById('hud-distance')
      const downLabel = down === 0 ? '—' : (DOWN_LABELS[down] || down)
      const distLabel = down === 0 ? '—' : distance
      if (downEl) downEl.textContent = downLabel
      if (distEl) distEl.textContent = distLabel

      // Field position
      const fpEl = document.getElementById('poss-field')
      if (fpEl) fpEl.textContent = field_pos ? `${field_pos.team} ${field_pos.yard}` : '—'

      // Quarter
      const qEl = document.getElementById('hud-quarter')
      if (qEl) qEl.textContent = quarter === 'OT' ? 'OT' : `Q${quarter}`

      // Clock
      const clockEl = document.getElementById('hud-clock')
      if (clockEl) clockEl.textContent = clock || '—'

      // Score
      const scoreHomeEl = document.getElementById('hud-score-home')
      const scoreAwayEl = document.getElementById('hud-score-away')
      const homeNameEl  = document.getElementById('hud-home-name')
      const awayNameEl  = document.getElementById('hud-away-name')
      if (scoreHomeEl) scoreHomeEl.textContent = score.home
      if (scoreAwayEl) scoreAwayEl.textContent = score.away
      if (homeNameEl)  homeNameEl.textContent  = teams.home.name
      if (awayNameEl)  awayNameEl.textContent  = teams.away.name

      // Possession bar
      const possTeamEl    = document.getElementById('poss-team')
      const possDownEl    = document.getElementById('poss-down-dist')
      if (possTeamEl) possTeamEl.textContent = possession
      if (possDownEl) possDownEl.textContent = down === 0
        ? '— & —' : `${downLabel} and ${distLabel}`

      // Possession buttons sync
      const homePossBtn = document.getElementById('pb0')
      const awayPossBtn = document.getElementById('pb1')
      if (homePossBtn) homePossBtn.classList.toggle('active', teams.home.name === possession)
      if (awayPossBtn) awayPossBtn.classList.toggle('active', teams.away.name === possession)
    }

    renderSidebar()

    onPlaySubmitted(() => {
      if (_activeQTab === gameState.quarter ||
          !plays.some(p => p.quarter === _activeQTab)) {
        _activeQTab = gameState.quarter
      }
      renderSidebar()
      renderHUD()
    })
  </script>

</body>
</html>
